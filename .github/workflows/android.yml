name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build offline web bundle
        run: npm run build:www

      - name: Create Android project
        run: npx cap add android

      - name: Apply MOVEXA icons, splash and version
        run: npm run android:assets
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Sync web bundle into Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MOVEXA.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MOVEXA 1.0.${{ github.run_number }}
          make_latest: true
          files: MOVEXA.apk
          body: |
            **Install on Android:** download `MOVEXA.apk` below on your phone, open it, and allow "Install unknown apps" for your browser when asked.

            Works offline. Reminders arrive as phone notifications even when the app is closed.

            MOVEXA gives general fitness information, not medical advice.
