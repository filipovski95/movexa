name: Fetch Everkinetic illustrations

on:
  push:
    paths: [".github/workflows/everkinetic.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download open exercise illustrations (CC BY-SA 3.0, Everkinetic)
        run: |
          git clone --depth 1 https://github.com/chaosbastler/opentraining-exercises /tmp/ot
          mkdir -p assets/everkinetic
          rsync -a --exclude='.git' /tmp/ot/ assets/everkinetic/
          ls -R assets/everkinetic | head -100
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/everkinetic
          git commit -m "Add Everkinetic exercise illustrations (CC BY-SA 3.0)" || echo "nothing to commit"
          git push
